name: Update Dashboard

on:
  schedule:
    - cron: '*/5 * * * 1-5'  # every 5 min, weekdays only
  workflow_dispatch: {}       # manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch dashboard from VPS
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.105.116.241 >> ~/.ssh/known_hosts 2>/dev/null

          # Pull generated HTML from VPS
          scp -o ConnectTimeout=15 -o StrictHostKeyChecking=no \
            root@178.105.116.241:/root/nq_sleeves/nq_dashboard.html index.html \
            || echo "VPS unreachable — keeping existing HTML"

          # Pull data snapshots for reference
          mkdir -p data
          scp -o ConnectTimeout=15 -o StrictHostKeyChecking=no \
            root@178.105.116.241:/root/v9/v9_live_heartbeat.json data/ 2>/dev/null || true
          scp -o ConnectTimeout=15 -o StrictHostKeyChecking=no \
            root@178.105.116.241:/root/v9/v9_live_trade_log.json data/ 2>/dev/null || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Dashboard update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
